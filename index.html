<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Teste e Validação</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <main class="main">
        <h1> Bem vindo ao <span>Formulário de Testes</span></h1>
        <p>Teste o Cadastro abaixo</p>

        <form id="formulario-cadastro">

            <!-- Seção: Dados Pessoais -->
            <section class="dados-pessoais">
                <h2><i class="fa-solid fa-user"></i>Dados Pessoais</h2>

                <div class="input">

                    <label for="nome">Nome completo</label>
                    <input type="text" class="nome" id="nome" required>

                </div>
                <div class="input">

                    <label for="CPF">CPF</label>
                    <input type="text" id="CPF" class="CPF" maxlength="14" placeholder="000.000.000-00" required>

                </div>
                <label for="data-nascimento">Data de Nascimento</label>
                <input type="date" id="data-nascimento" class="data-nascimento" required>

                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" class="sexo">
                    <option value="">Selecione...</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                    <option value="N">Prefiro não informar</option>
                </select>
            </section>


            <section class="contato">
                <h2><i class="fa-solid fa-envelope"></i>Contato</h2>

                <label for="email">E-mail</label>
                <input type="email" id="email" class="email" placeholder="exemplo@email.com" required>

                <label for="celular">Celular</label>
                <input type="tel" id="celular" class="celular" maxlength="15" placeholder="(00) 00000-0000" required>
            </section>


            <section class="endereco">
                <h2><i class="fa-solid fa-location-dot"></i>Endereço</h2>

                <label for="cep">CEP</label>
                <input type="text" id="cep" class="cep" maxlength="9" placeholder="00000-000" required>

                <label for="logradouro">Logradouro</label>
                <input type="text" id="logradouro" class="logradouro" required>

                <label for="numero">Número</label>
                <input type="text" id="numero" class="numero" required>

                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" class="complemento">

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" class="bairro" required>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" class="cidade" required>

                <label for="estado">Estado (UF)</label>
                <select id="estado" name="estado" class="estado" required>
                    <option value="">Selecione...</option>
                    <option value="AC">Acre (AC)</option>
                    <option value="AP">Amapá (AP)</option>
                    <option value="AM">Amazonas (AM)</option>
                    <option value="AL">Alagoas (AL)</option>
                    <option value="BA">Bahia (BA)</option>
                    <option value="BR">Brasília (BR)</option>
                    <option value="CE">Ceará (CE)</option>
                    <option value="ES">Espírito Santo (ES)</option>
                    <option value="GO">Goiás (GO)</option>
                    <option value="MA">Maranhão (MA)</option>
                    <option value="MT">Mato Grosso (MT)</option>
                    <option value="MS">Mato Grasso do Sul (MS)</option>
                    <option value="MG">Minas Gerais (MG)</option>
                    <option value="PR">Paraná (PR)</option>
                    <option value="PA">Pará (PA)</option>
                    <option value="PB">Paraíba (PB)</option>
                    <option value="PE">Pernambuco (PE)</option>
                    <option value="PI">Piauí (PI)</option>
                    <option value="RJ">Rio de Janeiro (RJ)</option>
                    <option value="RN">Rio Grande do Norte (RN)</option>
                    <option value="RS">Rio Grande do Sul (RS)</option>
                    <option value="RO">Rondônia (RO)</option>
                    <option value="RR">Roraima (RR)</option>
                    <option value="TO">Tocantins (TO)</option>
                    <option value="SA">Santa Catarina (SA)</option>
                    <option value="SP">São Paulo (SP)</option>
                    <option value="SE">Sergipe (SE)</option>
                    <option value="TO">Tocantins (TO)</option>
                    
                </select>
            </section>

            <!-- Seção: Confirmação -->
            <div class="confirmacao">
                <input type="checkbox" id="aceite" class="aceite" required>
                <label for="aceite">Aceito a declaração de que as informações são verdadeiras.</label>
            </div>

            <!-- Botões da aplicação -->
            <div class="botoes">
                <button type="submit" id="btn-cadastrar"> Cadastrar </button>
                <button type="reset" id="btn-limpar"> Limpar </button>
            </div>

        </form>

        <script src="scripts.js"></script>
    </main>
</body>

</html>
